name: flowhand-dev

volumes:
  pg-data:
  redis-data:
  etcd-data:

networks:
  flowhand:
    driver: bridge

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: flowhand
      POSTGRES_PASSWORD: flowhand
      POSTGRES_DB: flowhand
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowhand"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [flowhand]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [flowhand]

  etcd:
    image: quay.io/coreos/etcd:v3.6.12
    command:
      - /usr/local/bin/etcd
      - --name=etcd-0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd-0=http://etcd:2380
      - --initial-cluster-token=flowhand
      - --initial-cluster-state=new
    ports: ["2379:2379"]
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [flowhand]

  kafka:
    image: confluentinc/cp-kafka:8.2.2
    environment:
      KAFKA_NODE_ID: "0"
      KAFKA_PROCESS_ROLES: "controller,broker"
      KAFKA_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVGRkI3QzJFREI2NDE2NDg0NTI1Ng"
    ports: ["9092:9092"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [flowhand]

  seaweedfs:
    image: chrislusf/seaweedfs:3.68
    command: >
      server -dir=/data -ip=seaweedfs
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    volumes:
      - ./seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
    ports:
      - "8333:8333" # S3 API gateway — the aws-sdk-go-v2 endpoint
      - "9333:9333" # master UI
      - "8888:8888" # filer UI
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://localhost:9333/cluster/healthz || exit 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [flowhand]
