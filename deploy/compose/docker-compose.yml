name: flowhand-dev

volumes:
  pg-data:
  redis-data:
  etcd-data:

networks:
  flowhand:
    driver: bridge

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: flowhand
      POSTGRES_PASSWORD: flowhand
      POSTGRES_DB: flowhand
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports: ["5432:5432"]
    volumes:
      - pg-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowhand"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [flowhand]

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [flowhand]

  etcd:
    image: quay.io/coreos/etcd:v3.6.12
    command:
      - /usr/local/bin/etcd
      - --name=etcd-0
      - --data-dir=/etcd-data
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://0.0.0.0:2380
      - --initial-advertise-peer-urls=http://etcd:2380
      - --initial-cluster=etcd-0=http://etcd:2380
      - --initial-cluster-token=flowhand
      - --initial-cluster-state=new
    ports: ["2379:2379"]
    volumes:
      - etcd-data:/etcd-data
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 2s
      timeout: 2s
      retries: 20
    networks: [flowhand]
