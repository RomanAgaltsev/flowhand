server:
  http_listen_port: 9080

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    static_configs:
      - targets: [localhost]
        labels:
          job: containerlogs
          __path__: /var/lib/docker/containers/*/*-json.log
  - job_name: flowhand-host
    static_configs:
      - targets: [localhost]
        labels:
          job: flowhand
          __path__: /var/log/flowhand/*.log
