global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: flowhand
    static_configs:
      - targets: ["host.docker.internal:8080"]
    # flowhand runs on your host in dev; inside compose use container name
  - job_name: flowhand-demo
    static_configs:
      - targets: ["flowhand-demo:8081"]
    # in-network: compose DNS resolves the service name

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

rule_files:
  - '/etc/prometheus/rules/*.yml'
