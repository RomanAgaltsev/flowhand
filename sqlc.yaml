version: '2'
sql:
  - engine: postgresql
    queries: internal/storage/queries
    schema: migrations
    gen:
      go:
        package: queries
        out: internal/storage/queries
        sql_package: pgx/v5
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_pointers_for_null_types: true
        # A partition is a table to sqlc, so without this every month of
        # tasks_archive adds a struct nothing can use.
        omit_unused_structs: true
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type:
              type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type:
              type: "time.Time"
              pointer: true
