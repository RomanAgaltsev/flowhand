version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gocritic
    - gosec
    - nilerr
    - noctx
    - revive
    - unconvert
    - unparam

  settings:
    errcheck:
      check-blank: true
    revive:
      rules:
        - name: var-naming
        - name: exported
        - name: error-return
        - name: error-naming
        - name: if-return
        - name: range
        - name: errorf

  exclusions:
    rules:
      # G116 (Trojan Source) is reported at file scope, so the inline nolint on
      # the offending seed cannot reach it. The bidi control char is a
      # deliberate adversarial fuzz seed.
      - path: internal/api/validator_test.go
        text: G116
        linters:
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - gofumpt
    - goimports
